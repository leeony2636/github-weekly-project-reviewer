name: Legacy Qwen Weekly Review

on:
  workflow_dispatch:
    inputs:
      force_review:
        description: "새 변경사항이 없어도 강제로 분석"
        required: true
        default: false
        type: boolean

      upload_trace:
        description: "SQLite 실행 기록을 Artifact로 업로드"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: legacy-qwen-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  legacy-review:
    name: Legacy Qwen review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout reviewer repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-legacy.txt

      - name: Install legacy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-legacy.txt

      - name: Run legacy Qwen reviewer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}
          LOOKBACK_DAYS: "7"
          FORCE_REVIEW: ${{ inputs.force_review }}
        run: python scripts/weekly_review.py

      - name: Upload legacy review trace
        if: ${{ always() && inputs.upload_trace }}
        uses: actions/upload-artifact@v4
        with:
          name: legacy-qwen-review-trace
          path: review_trace.db
          if-no-files-found: ignore
          retention-days: 7