name: Weekly Project Review

on:
  schedule:
    # 매주 일요일 오전 9시(KST)
    # GitHub 기준 UTC 00:00
    - cron: "0 0 * * 0"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly project review
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
          TARGET_REPO: leeony2636/docker-fastapi-sentiment-api
        run: python scripts/weekly_review.py