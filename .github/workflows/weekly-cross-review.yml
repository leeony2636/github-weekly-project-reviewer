name: Weekly Three-Model Review

on:
  schedule:
    - cron: "20 0 * * 1"

  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback days"
        required: false
        default: "7"

      publish_issue:
        description: "Publish GitHub Issue"
        required: false
        type: boolean
        default: false

      upload_artifacts:
        description: "Upload artifacts"
        required: false
        type: boolean
        default: false


permissions:
  contents: read
  issues: write
  id-token: write


concurrency:
  group: weekly-cross-review-${{ vars.TARGET_REPO || github.repository }}
  cancel-in-progress: false


jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      PYTHONPATH: src

      # --------------------------------------------------
      # Target repository
      # --------------------------------------------------
      TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}

      # --------------------------------------------------
      # Provider API Keys
      # --------------------------------------------------
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # --------------------------------------------------
      # Qwen
      # --------------------------------------------------
      QWEN_MODEL: Qwen/Qwen2.5-Coder-3B-Instruct
      QWEN_BASE_URL: https://router.huggingface.co/featherless-ai/v1

      # --------------------------------------------------
      # Command A / Cohere
      # --------------------------------------------------
      GPT_MODEL: command-a-plus-05-2026
      GPT_BASE_URL: https://api.cohere.ai/compatibility/v1

      # --------------------------------------------------
      # Gemini
      # --------------------------------------------------
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_THINKING_LEVEL: low

      # --------------------------------------------------
      # Runtime
      # --------------------------------------------------
      PROVIDER_TIMEOUT_SECONDS: "90"
      MAX_OUTPUT_TOKENS: "4096"
      GPT_MAX_OUTPUT_TOKENS: "8192"

      # --------------------------------------------------
      # GitHub
      # --------------------------------------------------
      GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}

      # --------------------------------------------------
      # GCP
      # --------------------------------------------------
      GCP_PROJECT_ID: storm-wall-508003-s8
      GCP_ZONE: asia-northeast3-a
      GCP_VM_NAME: langfuse-reviewer


    steps:
      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout reviewer repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Google Cloud authentication
      # ==================================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3


      # ==================================================
      # 3. Start Langfuse VM
      # ==================================================
      - name: Start Langfuse VM
        shell: bash

        run: |
          set -e

          STATUS=$(gcloud compute instances describe "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format="value(status)")

          echo "Current VM status: ${STATUS}"

          if [ "${STATUS}" != "RUNNING" ]; then
            echo "Starting Langfuse VM..."

            # VM이 완전히 켜질 때까지 여기서 기다리지 않는다.
            # 뒤의 Python 설치/테스트와 VM 부팅을 동시에 진행한다.
            gcloud compute instances start "${GCP_VM_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --zone="${GCP_ZONE}" \
              --async

            echo "Langfuse VM start request submitted."
          else
            echo "Langfuse VM is already running."
          fi


      # ==================================================
      # 4. Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        shell: bash

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # 5. Unit tests
      # ==================================================
      - name: Run unit tests
        shell: bash

        env:
          PYTHONPATH: src

        run: |
          python -m pytest -q


      # ==================================================
      # 6. Wait for Langfuse
      # ==================================================
      - name: Wait for Langfuse
        id: langfuse
        shell: bash

        env:
          LANGFUSE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

        run: |
          set -e

          echo "Waiting for Langfuse..."

          # 최대 3분까지만 기다린다.
          DEADLINE=$((SECONDS + 180))
          ATTEMPT=0

          while (( SECONDS < DEADLINE )); do
            ATTEMPT=$((ATTEMPT + 1))

            # 기존:
            # curl 최대 5초 + sleep 5초
            #
            # 수정:
            # 연결 최대 1초 / 전체 최대 2초 / sleep 1초
            HTTP_CODE=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 1 \
              --max-time 2 \
              "${LANGFUSE_URL}" || true)

            echo "Attempt ${ATTEMPT} - HTTP ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Langfuse is ready."
              echo "ready=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 1
          done

          echo "Langfuse unavailable after 180 seconds."
          echo "ready=false" >> "${GITHUB_OUTPUT}"

          # Langfuse가 준비되지 않으면 모델을 실행하지 않는다.
          # Langfuse 데이터 없는 성공 실행을 막는다.
          exit 1


      # ==================================================
      # 7. Weekly Three-Model Review
      # ==================================================
      - name: Run weekly three-model review
        id: review
        shell: bash

        env:
          PYTHONPATH: src

          LANGFUSE_PUBLIC_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_PUBLIC_KEY || '' }}
          LANGFUSE_SECRET_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_SECRET_KEY || '' }}
          LANGFUSE_BASE_URL: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_BASE_URL || '' }}

        run: |
          set -e

          # Langfuse는 이번 실행에서 필수다.
          # 값 자체는 출력하지 않는다.
          if [ -z "${LANGFUSE_PUBLIC_KEY}" ] || \
             [ -z "${LANGFUSE_SECRET_KEY}" ] || \
             [ -z "${LANGFUSE_BASE_URL}" ]; then

            echo "Required Langfuse configuration is missing."
            exit 1
          fi

          ARGS=()

          LOOKBACK_DAYS="${{ github.event.inputs.lookback_days || '7' }}"

          ARGS+=(--days "${LOOKBACK_DAYS}")

          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=(--publish)
          elif [ "${{ github.event.inputs.publish_issue }}" = "true" ]; then
            ARGS+=(--publish)
          fi

          echo "Run arguments:"
          printf ' %q' "${ARGS[@]}"
          echo

          # 이 Python 실행이 끝나기 전에
          # langfuse_observer.py의 flush_langfuse()가
          # 실제 Langfuse 저장 여부까지 확인한다.
          python -m scripts.weekly_cross_review "${ARGS[@]}"


      # ==================================================
      # 8. Safe result summary
      # ==================================================
      - name: Show safe result summary
        if: always()
        shell: bash

        run: |
          if [ -f weekly_review_result.json ]; then
            python - <<'PY'
          import json

          with open(
              "weekly_review_result.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          safe_summary = {
              "review_type": data.get("review_type"),
              "status": data.get("status"),
              "repository": data.get("repository"),
              "error_type": data.get("error_type"),
              "commit_count": data.get("commit_count"),
              "pull_request_count": data.get("pull_request_count"),
              "changed_file_count": data.get("changed_file_count"),
              "successful_providers": data.get("successful_providers"),
              "provider_failures": data.get("provider_failures"),
              "consensus_count": data.get("consensus_count"),
              "published": data.get("published"),
          }

          print(safe_summary)
          PY
          else
            echo "weekly_review_result.json not found."
          fi


      # ==================================================
      # 9. Stop Langfuse VM
      # ==================================================
      - name: Stop Langfuse VM

        # review 성공 =
        # Python에서 Langfuse flush + 실제 observation 조회 확인까지 성공
        #
        # Langfuse 저장 확인이 실패하면 VM을 끄지 않는다.
        if: ${{ always() && steps.review.outcome == 'success' }}

        shell: bash

        run: |
          echo "Stopping Langfuse VM..."

          # 데이터 저장 확인은 이미 끝났다.
          # VM 종료 완료까지 GitHub Actions가 기다리지 않는다.
          gcloud compute instances stop "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --async \
            || true

          echo "Langfuse VM stop request submitted."