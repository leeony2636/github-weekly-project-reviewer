name: Weekly Three-Model Review

on:
  schedule:
    # 매주 월요일 오전 9시(한국 시간)
    - cron: "0 0 * * 1"

  workflow_dispatch:
    inputs:
      lookback_days:
        description: "검토할 최근 일수"
        required: true
        default: "7"
        type: string

      publish_issue:
        description: "검토 결과를 GitHub Issue로 생성"
        required: true
        default: false
        type: boolean

      upload_artifacts:
        description: "JSON 결과와 SQLite 기록 업로드"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: weekly-cross-review-${{ vars.TARGET_REPO || github.repository }}
  cancel-in-progress: false

jobs:
  weekly-review:
    name: Weekly three-model review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"

      TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}
      TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN || github.token }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      QWEN_MODEL: Qwen/Qwen2.5-Coder-3B-Instruct
      QWEN_BASE_URL: https://router.huggingface.co/featherless-ai/v1

      GPT_MODEL: command-a-plus-05-2026
      GPT_BASE_URL: https://api.cohere.ai/compatibility/v1

      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_THINKING_LEVEL: low

      PROVIDER_TIMEOUT_SECONDS: "90"
      MAX_FINDINGS_PER_MODEL: "5"
      MAX_OUTPUT_TOKENS: "4096"
      GPT_MAX_OUTPUT_TOKENS: "8192"

      QWEN_INPUT_CHAR_LIMIT: "4800"
      CLOUD_INPUT_CHAR_LIMIT: "4800"

      GPT_REVIEW_PERCENT: "20"
      GEMINI_REVIEW_PERCENT: "10"

      MAX_QWEN_CALLS_PER_RUN: "5"
      MAX_GPT_CALLS_PER_RUN: "5"
      MAX_GEMINI_CALLS_PER_RUN: "6"

      LINE_TOLERANCE: "1"
      MIN_MATCH_COUNT: "2"
      MIN_SUCCESSFUL_PROVIDERS: "3"

      FREE_ONLY_MODE: "true"
      CACHE_ENABLED: "true"
      DEGRADED_MODE_ON_QUOTA: "true"

      REVIEW_DB_PATH: weekly_review_trace.db
      WEEKLY_REVIEW_OUTPUT_PATH: weekly_review_result.json

      PUBLISH_ISSUE: ${{ github.event_name == 'schedule' || inputs.publish_issue }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}

      GCP_PROJECT_ID: storm-wall-508003-s8
      GCP_ZONE: asia-northeast3-a
      GCP_VM_NAME: langfuse-reviewer

    steps:
      - name: Checkout reviewer repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Start Langfuse VM
        shell: bash
        run: |
          set -e

          STATUS="$(
            gcloud compute instances describe "${GCP_VM_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --zone="${GCP_ZONE}" \
              --format="value(status)"
          )"

          echo "Current VM status: ${STATUS}"

          if [ "${STATUS}" != "RUNNING" ]; then
            gcloud compute instances start "${GCP_VM_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --zone="${GCP_ZONE}"
          fi

      - name: Start IAP tunnel and wait for Langfuse
        id: langfuse
        shell: bash
        run: |
          set +e

          nohup gcloud compute start-iap-tunnel \
            "${GCP_VM_NAME}" \
            3000 \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --local-host-port=127.0.0.1:3000 \
            >/tmp/langfuse-iap.log 2>&1 &

          echo $! >/tmp/langfuse-iap.pid

          READY="false"

          for attempt in $(seq 1 40); do
            HTTP_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 3 \
                http://127.0.0.1:3000 \
                || true
            )"

            echo "Langfuse check ${attempt}/40: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              READY="true"
              break
            fi

            sleep 5
          done

          echo "ready=${READY}" >> "${GITHUB_OUTPUT}"

          if [ "${READY}" != "true" ]; then
            echo "Langfuse is not ready."
            echo "Reviewer will continue without Langfuse tracing."
            cat /tmp/langfuse-iap.log || true
          fi

          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Run weekly three-model review
        shell: bash
        env:
          LANGFUSE_PUBLIC_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_PUBLIC_KEY || '' }}
          LANGFUSE_SECRET_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_SECRET_KEY || '' }}
          LANGFUSE_BASE_URL: ${{ steps.langfuse.outputs.ready == 'true' && 'http://127.0.0.1:3000' || '' }}
        run: |
          arguments=(
            --days "${LOOKBACK_DAYS}"
          )

          if [ "${PUBLISH_ISSUE}" = "true" ]; then
            arguments+=(--publish)
          fi

          python -m scripts.weekly_cross_review \
            "${arguments[@]}"

      - name: Show safe result summary
        if: always()
        run: |
          if [ -f weekly_review_result.json ]; then
            python - <<'PY'
          import json

          with open(
              "weekly_review_result.json",
              encoding="utf-8",
          ) as file:
              payload = json.load(file)

          issue = payload.get("issue", {})

          safe_summary = {
              "review_type": payload.get("review_type"),
              "status": payload.get("status", "completed"),
              "repository": payload.get("repository"),
              "error_type": payload.get("error_type"),
              "commit_count": payload.get("commit_count", 0),
              "pull_request_count": payload.get(
                  "pull_request_count",
                  0,
              ),
              "changed_file_count": payload.get(
                  "changed_file_count",
                  0,
              ),
              "successful_providers": payload.get(
                  "successful_providers",
                  [],
              ),
              "provider_failures": payload.get(
                  "provider_failures",
                  {},
              ),
              "consensus_count": payload.get(
                  "consensus_count",
                  0,
              ),
              "published": issue.get(
                  "published",
                  False,
              ),
          }

          print(safe_summary)
          PY
          else
            echo "Weekly review result was not created."
          fi

      - name: Stop Langfuse VM
        if: always()
        shell: bash
        run: |
          echo "Stopping Langfuse VM..."

          gcloud compute instances stop "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            || true