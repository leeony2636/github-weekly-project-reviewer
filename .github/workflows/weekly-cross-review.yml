name: Weekly Three-Model Review

on:
  schedule:
    - cron: "0 0 * * 1"

  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback days"
        required: false
        default: "7"

      publish_issue:
        description: "Publish GitHub Issue"
        required: false
        type: boolean
        default: false

      upload_artifacts:
        description: "Upload artifacts"
        required: false
        type: boolean
        default: false


permissions:
  contents: read
  issues: write
  id-token: write


concurrency:
  group: weekly-cross-review-${{ vars.TARGET_REPO || github.repository }}
  cancel-in-progress: false


jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # --------------------------------------------------
      # Target repository
      # --------------------------------------------------
      TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}

      # --------------------------------------------------
      # Provider API Keys
      # --------------------------------------------------
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # --------------------------------------------------
      # Qwen
      # --------------------------------------------------
      QWEN_MODEL: Qwen/Qwen2.5-Coder-3B-Instruct
      QWEN_BASE_URL: https://router.huggingface.co/hf-inference/v1

      # --------------------------------------------------
      # Command A / Cohere
      # --------------------------------------------------
      GPT_MODEL: command-a-plus-05-2026
      GPT_BASE_URL: https://api.cohere.ai/compatibility/v1

      # --------------------------------------------------
      # Gemini
      # --------------------------------------------------
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_THINKING_LEVEL: low

      # --------------------------------------------------
      # Runtime
      # --------------------------------------------------
      PROVIDER_TIMEOUT_SECONDS: "90"
      MAX_OUTPUT_TOKENS: "4096"
      GPT_MAX_OUTPUT_TOKENS: "8192"

      # --------------------------------------------------
      # GitHub
      # --------------------------------------------------
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # GCP
      # --------------------------------------------------
      GCP_PROJECT_ID: storm-wall-508003-s8
      GCP_ZONE: asia-northeast3-a
      GCP_VM_NAME: langfuse-reviewer


    steps:
      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout reviewer repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Google Cloud authentication
      # ==================================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3


      # ==================================================
      # 3. Start Langfuse VM
      # ==================================================
      - name: Start Langfuse VM
        shell: bash
        run: |
          set -e

          STATUS=$(gcloud compute instances describe "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format="value(status)")

          echo "Current VM status: ${STATUS}"

          if [ "${STATUS}" != "RUNNING" ]; then
            echo "Starting Langfuse VM..."

            gcloud compute instances start "${GCP_VM_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --zone="${GCP_ZONE}"

            echo "VM start command completed."
          else
            echo "Langfuse VM is already running."
          fi


      # ==================================================
      # 4. Wait for Langfuse
      #
      # Direct connection:
      # GitHub Actions -> 34.47.112.195:3000 -> Langfuse
      # ==================================================
      - name: Wait for Langfuse
        id: langfuse
        shell: bash

        env:
          LANGFUSE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

        run: |
          set +e

          echo "Waiting for Langfuse..."

          for i in $(seq 1 40); do

            HTTP_CODE=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 5 \
              "${LANGFUSE_URL}")

            echo "Attempt ${i}/40 - HTTP ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Langfuse is ready."
              echo "ready=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 5
          done

          echo "Langfuse unavailable."
          echo "Reviewer will continue without Langfuse tracing."
          echo "ready=false" >> "${GITHUB_OUTPUT}"

          exit 0


      # ==================================================
      # 5. Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # 6. Tests
      # ==================================================
      - name: Run unit tests
        shell: bash
        run: |
          python -m pytest -q


      # ==================================================
      # 7. Weekly Three-Model Review
      # ==================================================
      - name: Run weekly three-model review
        shell: bash

        env:
          LANGFUSE_PUBLIC_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_PUBLIC_KEY || '' }}

          LANGFUSE_SECRET_KEY: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_SECRET_KEY || '' }}

          LANGFUSE_BASE_URL: ${{ steps.langfuse.outputs.ready == 'true' && secrets.LANGFUSE_BASE_URL || '' }}

        run: |
          ARGS=()

          LOOKBACK_DAYS="${{ github.event.inputs.lookback_days || '7' }}"

          ARGS+=(--days "${LOOKBACK_DAYS}")

          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=(--publish-issue)
          elif [ "${{ github.event.inputs.publish_issue }}" = "true" ]; then
            ARGS+=(--publish-issue)
          fi

          echo "Run arguments:"
          printf ' %q' "${ARGS[@]}"
          echo

          python -m scripts.weekly_cross_review "${ARGS[@]}"


      # ==================================================
      # 8. Safe result summary
      # ==================================================
      - name: Show safe result summary
        if: always()
        shell: bash
        run: |
          if [ -f weekly_review_result.json ]; then
            python - <<'PY'
          import json

          with open(
              "weekly_review_result.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          safe_summary = {
              "review_type": data.get("review_type"),
              "status": data.get("status"),
              "repository": data.get("repository"),
              "error_type": data.get("error_type"),
              "commit_count": data.get("commit_count"),
              "pull_request_count": data.get("pull_request_count"),
              "changed_file_count": data.get("changed_file_count"),
              "successful_providers": data.get("successful_providers"),
              "provider_failures": data.get("provider_failures"),
              "consensus_count": data.get("consensus_count"),
              "published": data.get("published"),
          }

          print(safe_summary)
          PY
          else
            echo "weekly_review_result.json not found."
          fi


      # ==================================================
      # 9. Stop Langfuse VM
      # ==================================================
      - name: Stop Langfuse VM
        if: always()
        shell: bash
        run: |
          echo "Stopping Langfuse VM..."

          gcloud compute instances stop "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            || true

          echo "Langfuse VM stop step completed."