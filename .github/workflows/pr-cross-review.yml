name: PR Cross Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "분석할 Pull Request 번호"
        required: true
        type: string

      upload_artifacts:
        description: "리뷰 결과와 실행 기록을 Artifact로 업로드"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pr-cross-review-${{ vars.TARGET_REPO || github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Three-model PR review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"

      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}
      TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN || github.token }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      QWEN_MODEL: Qwen/Qwen2.5-Coder-3B-Instruct
      QWEN_BASE_URL: https://router.huggingface.co/featherless-ai/v1

      GPT_MODEL: command-a-plus-05-2026
      GPT_BASE_URL: https://api.cohere.ai/compatibility/v1

      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_THINKING_LEVEL: low

      PROVIDER_TIMEOUT_SECONDS: "90"
      MAX_FINDINGS_PER_MODEL: "5"
      MAX_OUTPUT_TOKENS: "800"

      QWEN_INPUT_CHAR_LIMIT: "4800"
      CLOUD_INPUT_CHAR_LIMIT: "4800"

      GPT_REVIEW_PERCENT: "20"
      GEMINI_REVIEW_PERCENT: "10"

      MAX_QWEN_CALLS_PER_RUN: "5"
      MAX_GPT_CALLS_PER_RUN: "5"
      MAX_GEMINI_CALLS_PER_RUN: "6"
      MIN_SUCCESSFUL_PROVIDERS: "3"

      LINE_TOLERANCE: "1"
      MIN_MATCH_COUNT: "2"

      FREE_ONLY_MODE: "true"
      CACHE_ENABLED: "true"
      DEGRADED_MODE_ON_QUOTA: "true"

      REVIEW_DB_PATH: review_trace.db
      REVIEW_OUTPUT_PATH: review_result.json

    steps:
      - name: Checkout reviewer repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Run three-model review
        run: |
          python scripts/pr_review.py \
            --pr "${{ inputs.pr_number }}"

      - name: Show safe result summary
        if: always()
        run: |
          if [ -f review_result.json ]; then
            python -c "import json; p=json.load(open('review_result.json', encoding='utf-8')); print({'pull_request_number': p['pull_request_number'], 'cache_hit': p.get('cache_hit'), 'degraded': p.get('degraded'), 'successful_providers': p['successful_providers'], 'provider_failures': p['provider_failures'], 'raw_finding_count': p['raw_finding_count'], 'invalid_line_count': p['invalid_line_count'], 'invalid_evidence_count': p.get('invalid_evidence_count'), 'consensus_count': p['consensus_count']})"
          else
            echo "Review result was not created."
          fi

      - name: Upload review artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-cross-review-${{ inputs.pr_number }}
          path: |
            review_result.json
            review_trace.db
          if-no-files-found: ignore
          retention-days: 7